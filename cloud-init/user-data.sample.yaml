#cloud-config
# 参考: scripts/02-create-node-vm.sh が実行時にこの形の user-data を生成する。
# 手動で virt-install する場合の雛形。
hostname: k8s-cp-1
fqdn: k8s-cp-1.k8s.local
manage_etc_hosts: true
users:
  - name: ubuntu
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...  # ここに ~/.ssh/id_ed25519.pub の中身
ssh_pwauth: false
package_update: true
runcmd:
  - [ swapoff, -a ]
  - [ sed, -ri, '/\sswap\s/s/^/#/', /etc/fstab ]
