---
# KVM ホスト（物理マシン / libvirt / OS）の監視エージェント（ADR-0008）。
#   - New Relic Infrastructure agent … 常用
#
# Instana host agent（評価目的）は GitOps 外・コミット対象外。
#   ansible/playbooks/local/60b-instana-host-agent.yml（gitignore）で導入する。
#
# localhost（= Ansible 実行ホスト = KVM ホスト）に導入する。sudo 必要。
#
#   cd ansible && ansible-playbook playbooks/60-host-agents.yml -e newrelic_license_key=XXX -K
#
# 対象は inventory の [kvm_hosts]（host-a=local / host-b 以降=SSH）。
# キーは -e か Ansible Vault で渡す。平文コミット禁止。sudo は -K で。
- name: Host monitoring agents (New Relic)
  hosts: kvm_hosts
  become: true
  vars:
    newrelic_license_key: ""          # 必須
    newrelic_region: "US"             # US | EU
  tasks:
    - name: NR | fail if no license key
      ansible.builtin.assert:
        that: newrelic_license_key | length > 0
        fail_msg: "newrelic_license_key を -e か Vault で指定してください"

    - name: NR | already installed?
      ansible.builtin.command: dpkg-query -W -f='${Status}' newrelic-infra
      register: nr_pkg
      changed_when: false
      failed_when: false

    # ---- 未導入のときだけ repo を足して入れる（既存環境の apt を壊さない）----
    - name: NR | setup repo & install
      when: "'install ok installed' not in nr_pkg.stdout"
      block:
        - name: NR | keyring dir
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: NR | ensure gnupg
          ansible.builtin.apt:
            name: gnupg
            state: present
            update_cache: false

        - name: NR | apt key（armored を dearmor して保存）
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail &&
              curl -fsSL https://download.newrelic.com/infrastructure_agent/gpg/newrelic-infra.gpg
              | gpg --dearmor --yes -o /etc/apt/keyrings/newrelic-infra.gpg
          args:
            executable: /bin/bash
          changed_when: false

        - name: NR | keyring perms
          ansible.builtin.file:
            path: /etc/apt/keyrings/newrelic-infra.gpg
            mode: "0644"

        - name: NR | apt repo
          ansible.builtin.apt_repository:
            repo: >-
              deb [signed-by=/etc/apt/keyrings/newrelic-infra.gpg]
              https://download.newrelic.com/infrastructure_agent/linux/apt {{ ansible_distribution_release }} main
            filename: newrelic-infra
            state: present
            update_cache: false

        - name: NR | update only the newrelic repo（他 repo のエラーで失敗しないように）
          ansible.builtin.command: >-
            apt-get update
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/newrelic-infra.list
            -o Dir::Etc::sourceparts=/dev/null
            -o APT::Get::List-Cleanup=0
          changed_when: false

        - name: NR | install newrelic-infra
          ansible.builtin.apt:
            name: newrelic-infra
            state: present

    - name: NR | config
      ansible.builtin.copy:
        dest: /etc/newrelic-infra.yml
        mode: "0640"
        content: |
          license_key: {{ newrelic_license_key }}
          display_name: {{ ansible_hostname }}-kvm-host
          custom_attributes:
            role: kvm-host
            environment: homelab
      notify: restart newrelic-infra

    - name: NR | enable service
      ansible.builtin.systemd:
        name: newrelic-infra
        enabled: true
        state: started

  handlers:
    - name: restart newrelic-infra
      ansible.builtin.systemd: { name: newrelic-infra, state: restarted }
