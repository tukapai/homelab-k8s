---
# metrics-server を導入する（kubectl top / Dashboard・Headlamp のリソースグラフ用）。
# 任意。site.yml には含めない:
#   cd ansible && ansible-playbook playbooks/42-metrics-server.yml
- name: Deploy metrics-server
  hosts: control_plane
  become: true
  vars:
    kc: "--kubeconfig /etc/kubernetes/admin.conf"
    metrics_server_version: "v0.7.2"
  tasks:
    - name: Apply metrics-server manifest
      ansible.builtin.command: >-
        kubectl {{ kc }} apply -f
        https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
      register: ms
      changed_when: "'created' in ms.stdout or 'configured' in ms.stdout"

    - name: Read current metrics-server args
      ansible.builtin.command: >-
        kubectl {{ kc }} -n kube-system get deployment metrics-server
        -o jsonpath={.spec.template.spec.containers[0].args}
      register: ms_args
      changed_when: false

    - name: Allow self-signed kubelet certs (kubeadm nodes)
      # kubeadm のノードは kubelet serving cert が自己署名なので必須
      ansible.builtin.shell: >-
        kubectl {{ kc }} -n kube-system patch deployment metrics-server --type=json
        -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      when: "'--kubelet-insecure-tls' not in ms_args.stdout"
      register: patch
      changed_when: patch.rc == 0

    - name: Wait for metrics-server rollout
      ansible.builtin.command: >-
        kubectl {{ kc }} -n kube-system rollout status deployment/metrics-server --timeout=120s
      changed_when: false

    - name: Wait for metrics API to serve data
      ansible.builtin.command: kubectl {{ kc }} top nodes --no-headers
      register: top
      until: top.rc == 0
      retries: 12
      delay: 10
      changed_when: false

    - name: Show node metrics
      ansible.builtin.debug:
        var: top.stdout_lines
